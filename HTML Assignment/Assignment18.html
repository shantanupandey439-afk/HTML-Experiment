<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        /* Main container */
        .container {
            width: 660px;
            margin: 20px auto;
            background-color: white;
        }

        /* Header */
        header {
            background-color: #1c267f;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        /* Main content */
        main {
            padding: 15px 88px;
        }

        h2 {
            font-size: 24px;
            margin-top: 0;
        }

        /* Courses table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        caption {
            font-size: 16px;
            margin-bottom: 0;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 5px;
            text-align: left;
        }

        th {
            background-color: #e8eaf6;
            text-align: center;
        }

        /* Application form */
        fieldset {
            border: 2px groove #ccc;
            padding: 10px;
        }

        legend {
            font-size: 16px;
        }

        label {
            display: block;
            margin-bottom: 2px;
        }

        input[type="text"],
        input[type="email"] {
            width: 220px;
            padding: 3px;
            margin-bottom: 15px;
        }

        select {
            padding: 3px;
            margin-bottom: 15px;
        }

        textarea {
            width: 390px;
            height: 55px;
            margin-bottom: 15px;
        }

        button {
            padding: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Footer */
        footer {
            background-color: #1c267f;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header Section -->
        <header>
            <h1>ABC College Admission 2026</h1>
        </header>

        <!-- Main Section -->
        <main>

            <h2>Courses and Fees</h2>

            <!-- Courses Table -->
            <table>
                <caption>Available Courses</caption>

                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>₹90,000</td>
                    </tr>

                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>₹45,000</td>
                    </tr>
                </tbody>
            </table>

            <!-- Application Form -->
            <form action="#" method="post">

                <fieldset>
                    <legend>Application Form</legend>

                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                    <label for="course">Course:</label>
                    <select id="course" name="course" required>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>

                    <label for="statement">Statement:</label>
                    <textarea
                        id="statement"
                        name="statement"
                        required
                    ></textarea>

                    <br>

                    <button type="submit">Apply</button>

                </fieldset>

            </form>

        </main>

        <!-- Footer Section -->
        <footer>
            © 2026 ABC College
        </footer>

    </div>

</body>
</html>
